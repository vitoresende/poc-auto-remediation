[tool.poetry]
name = "poc-auto-remediation"
version = "0.1.0"
description = "PoC Auto-Remediation Agent (Sentry -> GitHub) Monorepo: Dummy App & Remediation Agent"
authors = ["Vitor Resende <vitoresende@gmail.com>"]
readme = "README.md"
packages = [
    { include = "dummy_app", from = "src" },
    { include = "remediation_agent", from = "src" },
]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
sentry-sdk = { extras = ["fastapi"], version = "^2.18.0" }
pydantic = "^2.9.0"
python-dotenv = "^1.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
httpx = "^0.27.0"
ruff = "^0.7.0"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
